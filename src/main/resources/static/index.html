<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Janus - Network Discovery</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
    <h1>Janus <small>Network Discovery</small></h1>
    <label>Report <select id="reports" aria-label="Select report"></select></label>
    <input id="search" type="search" placeholder="Search IP / hostname / MAC" autocomplete="off">
    <select id="layout" aria-label="Layout">
        <option value="force">Physical topology</option>
        <option value="vlan">VLAN groups</option>
        <option value="virt">Virtualization</option>
    </select>
    <select id="color" aria-label="Color">
        <option value="type">Device type</option>
        <option value="source">Discovery method</option>
        <option value="vlan">VLAN</option>
    </select>
    <button id="refresh">Refresh</button>
    <span id="stats">Loading report...</span>
</header>
<main>
    <svg id="graph" role="img" aria-label="Network topology graph"></svg>
    <aside id="details" hidden>
        <button id="close" aria-label="Close">×</button>
        <h2 id="title"></h2>
        <div id="content"></div>
    </aside>
    <div id="legend"></div>
    <section id="subnets" aria-label="Discovered subnets">
        <h2>Subnets <span id="subnetCount"></span></h2>
        <ul id="segmentTree"></ul>
    </section>
    <div id="error" role="alert" hidden></div>
</main>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
